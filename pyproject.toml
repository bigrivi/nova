[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
dynamic = ["version"]
description = "A local personal AI agent assistant for terminal and desktop workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "bigrivi" }]
keywords = ["ai", "ai-agent", "coding-agent", "cli", "llm", "mcp", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp",
    "aiosqlite",
    "fastapi>=0.141.1",
    "httpx",
    # Grapheme-cluster segmentation for truncating text at a character boundary.
    # Already present transitively via tiktoken, but relied on directly here.
    "regex",
    "rich",
    "uvicorn",
    "tiktoken",
    "playwright",
    "markdownify",
    "pywebview>=5,<7",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.14",
]
build = [
    "pyinstaller",
]

[project.scripts]
nova = "nova.__main__:main"

[project.urls]
Homepage = "https://github.com/bigrivi/nova"
Repository = "https://github.com/bigrivi/nova"
Issues = "https://github.com/bigrivi/nova/issues"

[tool.setuptools.dynamic]
version = { attr = "nova.__version__" }

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
]
ignore = [
    # FastAPI declares dependencies in default values (Depends, Query, Body).
    "B008",
    # The formatter owns line length; only unbreakable strings land here.
    "E501",
    # A swallowed exception is deliberate in provider call sites and teardown
    # paths, which must degrade rather than crash.
    "SIM105",
    # The faker and the title generator emit Chinese text, so fullwidth
    # punctuation in their string literals is the point, not a typo.
    "RUF001",
    # Every provider exposes a timeout argument; that is the contract, not an
    # async API mistake.
    "ASYNC109",
    # Path.resolve() and friends are microsecond-scale, not the blocking
    # syscalls this rule is meant to catch.
    "ASYNC240",
]

[dependency-groups]
dev = [
    "types-regex>=2026.9.29.20261005",
]
