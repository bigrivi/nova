[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
dynamic = ["version"]
description = "Self-hosted AI agent with its own identity, memory, and skills. Runs local with Ollama or any LLM API — terminal, web, desktop, HTTP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "bigrivi" }]
keywords = ["ai", "ai-agent", "coding-agent", "cli", "llm", "mcp", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp",
    "aiosqlite",
    "fastapi>=0.141.1",
    "httpx",
    # Cron expression to "when does this fire next". Only that: the schedule
    # store, the tick loop and the catch-up policy are Nova's own, because they
    # have to line up with the session and approval semantics.
    "croniter",
    # Shell grammar, so a compound command can be split into the commands it
    # actually runs instead of being matched as one string. A regex cannot tell
    # `curl x && make | python3 f` from `curl x | python3 f`: the pipe belongs to
    # `make` in the first and to `curl` in the second, and only the parse knows.
    "tree-sitter>=0.26",
    "tree-sitter-bash>=0.25",
    # Grapheme-cluster segmentation for truncating text at a character boundary.
    # Already present transitively via tiktoken, but relied on directly here.
    "regex",
    "rich",
    "uvicorn",
    "tiktoken",
    # Agent definitions are imported from other tools' Markdown, whose
    # frontmatter uses real YAML (block scalars, nested permission maps). The
    # parser for our own files stays hand-rolled; this is only for input we did
    # not write.
    "pyyaml",
    "playwright",
    "markdownify",
    # Image downscaling before an attachment is stored and replayed: providers
    # resize every picture anyway, so the bytes above their limit buy nothing.
    "pillow",
    "pywebview>=5,<7",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
]

[project.optional-dependencies]
gateway = [
    # SILK decoding for QQ voice: no transcription provider reads SILK, and
    # ffmpeg has no silk decoder either, so the payload is decoded here.
    "silk-python",
    # Platform SDKs, imported lazily by the adapters that need them.
    "qq-botpy",
    "lark-oapi",
    "dingtalk-stream",
]
dev = [
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    # Bounded above: a ruff release can add a default rule and turn CI red
    # on code nobody touched, as 0.17.4 did with SIM102.
    "ruff>=0.17.4,<0.18",
]
build = [
    "pyinstaller",
]

[project.scripts]
nova = "nova.__main__:main"

[project.urls]
Homepage = "https://github.com/bigrivi/nova"
Repository = "https://github.com/bigrivi/nova"
Issues = "https://github.com/bigrivi/nova/issues"

[tool.setuptools.dynamic]
# Read from the module that holds the literal, not from the package: setuptools
# resolves `attr` by importing the target, and importing `nova` pulls in aiohttp
# and the rest of the runtime, which a clean build environment does not have.
version = { attr = "nova.version.__version__" }

[tool.setuptools.packages.find]
include = ["nova*"]

# The preset table is data, not code: it ships beside the module that reads it.
[tool.setuptools.package-data]
nova = ["*.json"]
"nova.registry" = ["*.json"]

[tool.mypy]
# Batch type check for the package. Python 3.12 matches CI, not the local
# interpreter; missing third-party stubs are ignored rather than silenced file
# by file.
python_version = "3.12"
files = ["nova"]
exclude = ["^build/", "^dist/", "^site/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
]
ignore = [
    # FastAPI declares dependencies in default values (Depends, Query, Body).
    "B008",
    # The formatter owns line length; only unbreakable strings land here.
    "E501",
    # A swallowed exception is deliberate in provider call sites and teardown
    # paths, which must degrade rather than crash.
    "SIM105",
    # The faker and the title generator emit Chinese text, so fullwidth
    # punctuation in their string literals is the point, not a typo.
    "RUF001",
    # Every provider exposes a timeout argument; that is the contract, not an
    # async API mistake.
    "ASYNC109",
    # Path.resolve() and friends are microsecond-scale, not the blocking
    # syscalls this rule is meant to catch.
    "ASYNC240",
]

[dependency-groups]
dev = [
    "types-regex>=2026.9.29.20261005",
]
