name: Mobile release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - run: bun install --frozen-lockfile

      - name: Prebuild with release signing
        run: npx expo prebuild --platform android --no-install
        env:
          NOVA_KEYSTORE_FILE: ${{ runner.temp }}/nova-release.keystore
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: mobile/android

      - name: Name the APK
        run: |
          version=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk \
            "nova-${version}-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nova-android-apk
          path: mobile/nova-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/nova-*.apk
          generate_release_notes: true
