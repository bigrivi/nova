name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nova
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bigrivi/novakit
          path: novakit
          # Temporary local-package mode; pin after the novakit integration commit.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova/pyproject.toml
      - name: Install uv
        run: python -m pip install uv
      - name: Sync local SDK and Nova
        run: uv sync --locked --extra dev
        working-directory: nova
      - name: Run tests
        run: uv run pytest -q
        working-directory: nova

  types:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nova
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bigrivi/novakit
          path: novakit
          # Temporary local-package mode; pin after the novakit integration commit.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova/pyproject.toml
      - name: Install uv
        run: python -m pip install uv
      - name: Sync local SDK and Nova
        run: uv sync --locked --extra dev
        working-directory: nova
      - name: Lint
        run: uv run ruff check nova tests
        working-directory: nova
      - name: Type check
        run: uv run mypy
        working-directory: nova

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  tui:
    name: TUI typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: tui
      - run: bun run typecheck
        working-directory: tui
      - run: bun run test
        working-directory: tui
      - run: bun run build
        working-directory: tui

  mobile:
    name: Mobile typecheck, test and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - run: bun run typecheck
        working-directory: mobile
      - run: bun run test
        working-directory: mobile
      - run: bun run export:android
        working-directory: mobile
