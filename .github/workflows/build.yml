name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements.txt pyinstaller pyarmor
      - run: python build.py --clean --obfuscate
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows
          path: dist/Nova/
          retention-days: 1
