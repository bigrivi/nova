name: Feature request
description: Suggest an idea or improvement for Nova
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem or need would this solve?
      placeholder: Describe the situation or pain point. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
      placeholder: Describe the feature or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you looked at?
      placeholder: Other solutions, workarounds, or related tools you considered.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this affect?
      description: Pick the surface that is most relevant, or choose the closest match.
      options:
        - TUI
        - server
        - web frontend
        - desktop
        - shared runtime (nova/)
        - docs
        - not surface specific
      default: 6
    validations:
      required: true
  - type: checkboxes
    id: searched
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
